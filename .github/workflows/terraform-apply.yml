name: terraform apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "internal/**"
      - "main.go"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

concurrency:
  # One apply at a time. A second merge waits rather than racing for the lock.
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Configure this environment in Settings > Environments with a required
    # reviewer if you want a human approval gate between merge and apply.
    environment: omni-playground
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build provider
        working-directory: .
        run: |
          go build -o "${RUNNER_TEMP}/plugins/terraform-provider-omni" .
          cat > ~/.terraformrc <<TFRC
          provider_installation {
            dev_overrides {
              "ashima-omni/omni" = "${RUNNER_TEMP}/plugins"
            }
            direct {}
          }
          TFRC

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: terraform init -input=false

      - name: Apply
        env:
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          OMNI_API_TOKEN: ${{ secrets.OMNI_API_TOKEN }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      - name: Outputs
        env:
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          OMNI_API_TOKEN: ${{ secrets.OMNI_API_TOKEN }}
        run: |
          echo '### Omni resource IDs' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          terraform output -json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
