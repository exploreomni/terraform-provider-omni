name: provider crud test

# Manual only. This creates and deletes real users, groups, models and folders
# on the target instance, so it must never fire automatically on a push or PR.
on:
  workflow_dispatch:
    inputs:
      connection_name:
        description: "Existing connection the test model is built on"
        required: true
        default: "ecommerce dev"
      base_model_name:
        description: "Existing SHARED model to extend"
        required: true
        default: "ci-validate-27355042357"
      test_user_email:
        description: "Email for the test user (must not be a real person)"
        required: true
        default: "tf-provider-test@example.invalid"
      user_attribute_key:
        description: "Reference of an existing user attribute, or blank to skip"
        required: false
        default: ""
      tools:
        description: "Which CLI to run the suite under"
        type: choice
        options: [both, terraform, tofu]
        default: both
      destroy:
        description: "Destroy at the end"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two runs against one instance would collide on names and roles.
  group: provider-crud-test
  cancel-in-progress: false

defaults:
  run:
    working-directory: test

jobs:
  crud:
    name: crud (${{ matrix.tool }})
    runs-on: ubuntu-latest
    environment: omni-playground

    strategy:
      fail-fast: false
      # One leg at a time. Two runs against a single instance would compete for
      # the 60 requests a minute rate limit.
      max-parallel: 1
      matrix:
        # Built from the input rather than filtered with a job-level `if`:
        # `matrix` is not available in that context, and referencing it there
        # makes the whole workflow invalid.
        tool: >-
          ${{ inputs.tools == 'both'
              && fromJSON('["terraform","tofu"]')
              || fromJSON(format('["{0}"]', inputs.tools)) }}

    env:
      OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
      OMNI_API_TOKEN: ${{ secrets.OMNI_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF: ${{ matrix.tool }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        if: matrix.tool == 'terraform'
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false

      - uses: opentofu/setup-opentofu@v1
        if: matrix.tool == 'tofu'
        with:
          tofu_version: "1.8.*"
          tofu_wrapper: false

      - name: Build provider into a filesystem mirror
        working-directory: .
        run: |
          # Terraform and OpenTofu resolve an unqualified source against
          # different default registries, so the binary goes under both
          # hostnames and both CLI config files get the same block. The same
          # configuration then works unchanged under either tool, which is the
          # thing being tested.
          VERSION=0.1.0
          for HOST in registry.terraform.io registry.opentofu.org; do
            MIRROR="${RUNNER_TEMP}/plugins/${HOST}/ashima-omni/omni/${VERSION}/linux_amd64"
            mkdir -p "$MIRROR"
            go build -o "${MIRROR}/terraform-provider-omni_v${VERSION}" .
          done

          CONFIG=$(cat <<TFRC

          provider_installation {
            filesystem_mirror {
              path = "${RUNNER_TEMP}/plugins"
              include = [
                "registry.terraform.io/ashima-omni/omni",
                "registry.opentofu.org/ashima-omni/omni",
              ]
            }
            direct {
              exclude = [
                "registry.terraform.io/ashima-omni/omni",
                "registry.opentofu.org/ashima-omni/omni",
              ]
            }
          }
          TFRC
          )

          # setup-terraform writes ~/.terraformrc itself when given a token, so
          # append rather than overwrite.
          printf '%s\n' "$CONFIG" >> ~/.terraformrc
          printf '%s\n' "$CONFIG" >> ~/.tofurc

      - name: Write tfvars
        run: |
          # Names are unique per run. A run that fails before destroy leaves
          # objects behind, and fixed names would then collide with the next
          # run: renaming a model to a name an orphan already holds is rejected.
          SHORT=$(echo "${{ matrix.tool }}" | cut -c1-2)
          echo "SUFFIX=r${GITHUB_RUN_NUMBER}${SHORT}" >> "$GITHUB_ENV"
          echo "SUFFIX_V2=r${GITHUB_RUN_NUMBER}${SHORT}b" >> "$GITHUB_ENV"

          EMAIL="${{ inputs.test_user_email }}"
          EMAIL="${EMAIL%%@*}-r${GITHUB_RUN_NUMBER}${SHORT}@${EMAIL##*@}"

          cat > terraform.tfvars <<TFVARS
          connection_name    = "${{ inputs.connection_name }}"
          base_model_name    = "${{ inputs.base_model_name }}"
          test_user_email    = "${EMAIL}"
          user_attribute_key = "${{ inputs.user_attribute_key }}"
          suffix             = "r${GITHUB_RUN_NUMBER}${SHORT}"
          test_connection    = false
          TFVARS
          cat terraform.tfvars

      # State is local to this runner and thrown away when the job ends. That
      # is correct here only because the job always destroys before finishing.
      # If destroy fails, the created objects are orphaned with no state, and
      # the log prints their IDs so they can be removed by hand.
      - name: TC-00 init and validate
        run: |
          $TF init -input=false
          terraform validate

      - name: TC-01..08 create
        run: $TF apply -auto-approve

      - name: Record IDs for post-destroy verification
        id: ids
        run: |
          $TF output -json ids > "${RUNNER_TEMP}/ids-${{ matrix.tool }}.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          ids = json.load(open(f"{os.environ['RUNNER_TEMP']}/ids-{os.environ['TF']}.json"))
          for k, v in ids.items():
              if v:
                  print(f"ID_{k.upper()}={v}")
          PY
          cat "${RUNNER_TEMP}/ids-${{ matrix.tool }}.json"

      # Prints the raw model-roles responses. The from.type labels are not
      # documented and differ between the two endpoints, so this is how we know
      # what the provider has to match on.
      - name: TC-07/08 role assignments as the API reports them
        run: |
          echo "--- user model roles ---"
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/users/${ID_USER}/model-roles" | python3 -m json.tool
          echo "--- user group model roles ---"
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/user-groups/${ID_USER_GROUP}/model-roles" | python3 -m json.tool

      - name: TC-09 read round-trips with no drift
        run: |
          set +e
          $TF plan -detailed-exitcode -out=/dev/null
          code=$?
          set -e
          case $code in
            0) echo "PASS: no drift after create" ;;
            2) echo "FAIL: drift detected after create"; exit 1 ;;
            *) echo "FAIL: plan errored"; exit 1 ;;
          esac

      - name: TC-10 data sources resolve to the created objects
        run: |
          $TF output -json data_sources | tee ds.json
          python3 - <<'PY'
          import json, sys
          ds = json.load(open("ds.json"))
          failures = [k for k in ("user_ids_match", "group_ids_match") if not ds.get(k)]
          for k, v in ds.items():
              print(f"  {k}: {v}")
          if failures:
              sys.exit("FAIL: data source mismatch: " + ", ".join(failures))
          print("PASS: data sources resolve correctly")
          PY

      - name: TC-11..18 update
        run: |
          $TF apply -auto-approve \
            -var "suffix=${SUFFIX_V2}" \
            -var 'role_name=VIEWER'

      - name: TC-19 read round-trips after update
        run: |
          set +e
          $TF plan -detailed-exitcode -out=/dev/null \
            -var "suffix=${SUFFIX_V2}" \
            -var 'role_name=VIEWER'
          code=$?
          set -e
          case $code in
            0) echo "PASS: no drift after update" ;;
            2) echo "FAIL: drift detected after update"; exit 1 ;;
            *) echo "FAIL: plan errored"; exit 1 ;;
          esac

      - name: TC-11 confirm the rename reached the API
        run: |
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/folders?pageSize=100" \
          | python3 -c "
          import sys, json, os
          want = os.environ['ID_FOLDER_PARENT']
          rec = [f for f in json.load(sys.stdin)['records'] if f['id'] == want]
          if not rec:
              sys.exit('FAIL: renamed folder not found')
          f = rec[0]
          print('  name:', f['name'], ' path:', f['path'])
          if not f['name'].endswith(os.environ['SUFFIX_V2']):
              sys.exit('FAIL: rename did not reach the API')
          print('PASS: rename confirmed server side')
          "

      # Always destroy, even if an earlier step failed. Without this, a failure
      # leaves objects on the instance with no state to clean them up from.
      - name: TC-21..28 destroy
        if: always() && inputs.destroy
        run: |
          $TF destroy -auto-approve \
            -var "suffix=${SUFFIX_V2}" \
            -var 'role_name=VIEWER'

      - name: TC-25..28 verify what could not truly be deleted
        if: always() && inputs.destroy
        run: |
          echo "### Post-destroy verification" >> "$GITHUB_STEP_SUMMARY"

          echo "TC-27 user role should read NO_ACCESS:"
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/users/${ID_USER}/model-roles" \
          | python3 -m json.tool || echo "  (user was deleted, roles gone with it)"

          echo "TC-25 model should carry deletedAt:"
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/models?pageSize=100" \
          | python3 -c "
          import sys, json, os
          want = os.environ.get('ID_MODEL')
          hit = [m for m in json.load(sys.stdin)['records'] if m['id'] == want]
          print('  still listed as active' if hit else '  absent from the active list (archived)')
          "

          echo "TC-23 user should be gone:"
          curl -s -o /dev/null -w '  GET user returned %{http_code}\n' \
            -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/scim/v2/users/${ID_USER}"

      - name: Orphan warning
        if: failure()
        run: |
          echo "Destroy may not have completed. Objects created by this run:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/ids-${{ matrix.tool }}.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "{}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Remove any that survive by hand." >> "$GITHUB_STEP_SUMMARY"
