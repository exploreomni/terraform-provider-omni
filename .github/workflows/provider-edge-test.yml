name: provider edge test

# Covers the cases the main CRUD suite cannot: negative paths, out-of-band
# drift, imports, and the connection resource.
#
# Several of these expect Terraform to FAIL. A step that "passes" here often
# means a command exited non-zero for the documented reason, so each one checks
# the error text rather than just the exit code.
on:
  workflow_dispatch:
    inputs:
      base_model_name:
        description: "Existing SHARED model to extend"
        required: true
        default: "ci-validate-27355042357"
      test_connection:
        description: "Attempt the connection resource with placeholder credentials"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Shared with the other suites on purpose. Two runs against one instance
  # compete for the 60 requests a minute limit, and a rate-limited curl looks
  # like a test failure rather than what it is.
  group: omni-instance
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    environment: omni-playground
    env:
      OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
      OMNI_API_TOKEN: ${{ secrets.OMNI_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
          terraform_wrapper: false

      - name: Build provider into a filesystem mirror
        run: |
          VERSION=0.1.0
          MIRROR="${RUNNER_TEMP}/plugins/registry.terraform.io/ashima-omni/omni/${VERSION}/linux_amd64"
          mkdir -p "$MIRROR"
          go build -o "${MIRROR}/terraform-provider-omni_v${VERSION}" .
          cat >> ~/.terraformrc <<TFRC

          provider_installation {
            filesystem_mirror {
              path    = "${RUNNER_TEMP}/plugins"
              include = ["registry.terraform.io/ashima-omni/omni"]
            }
            direct {
              exclude = ["registry.terraform.io/ashima-omni/omni"]
            }
          }
          TFRC

      # ------------------------------------------------------------------
      # Negative cases. No API calls: these must fail during validation.
      # ------------------------------------------------------------------

      - name: TC-30 role with neither model_id nor connection_id is rejected
        run: |
          mkdir -p "${RUNNER_TEMP}/tc30" && cd "${RUNNER_TEMP}/tc30"
          cat > main.tf <<'EOF'
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          resource "omni_user_model_role" "bad" {
            user_id   = "00000000-0000-0000-0000-000000000000"
            role_name = "QUERIER"
          }
          EOF
          terraform init -input=false >/dev/null
          if terraform validate 2>err.txt; then
            echo "FAIL: config validated when it should have been rejected"; exit 1
          fi
          cat err.txt
          if grep -qi "model_id\|connection_id" err.txt; then
            echo "PASS: rejected before any API call"
          else
            echo "FAIL: rejected for the wrong reason"; exit 1
          fi

      - name: TC-31 invalid dialect is rejected with the allowed values
        run: |
          mkdir -p "${RUNNER_TEMP}/tc31" && cd "${RUNNER_TEMP}/tc31"
          cat > main.tf <<'EOF'
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          resource "omni_connection" "bad" {
            name    = "tf-edge-invalid-dialect"
            dialect = "notadialect"
          }
          EOF
          terraform init -input=false >/dev/null
          if terraform validate 2>err.txt; then
            echo "FAIL: invalid dialect accepted"; exit 1
          fi
          cat err.txt
          if grep -qi "snowflake" err.txt; then
            echo "PASS: rejected and the allowed values were listed"
          else
            echo "FAIL: message did not list valid dialects"; exit 1
          fi

      - name: TC-29 an invalid token fails cleanly with no state written
        run: |
          mkdir -p "${RUNNER_TEMP}/tc29" && cd "${RUNNER_TEMP}/tc29"
          cat > main.tf <<'EOF'
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          resource "omni_folder" "f" {
            name = "tf-edge-should-never-exist"
          }
          EOF
          terraform init -input=false >/dev/null
          if OMNI_API_TOKEN=definitely-not-a-valid-token terraform apply -auto-approve 2>err.txt; then
            echo "FAIL: apply succeeded with an invalid token"; exit 1
          fi
          cat err.txt
          if [ -s terraform.tfstate ] && grep -q '"omni_folder"' terraform.tfstate; then
            echo "FAIL: a resource was written to state despite the failure"; exit 1
          fi
          echo "PASS: failed cleanly, nothing in state"

      # ------------------------------------------------------------------
      # Live cases. These create real objects and clean up after themselves.
      # ------------------------------------------------------------------

      - name: Set up a scratch workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/live" && cd "${RUNNER_TEMP}/live"
          cat > main.tf <<'EOF'
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}

          variable "folder_name" { type = string }

          resource "omni_folder" "f" {
            name = var.folder_name
            path = var.folder_name
          }

          output "id"  { value = omni_folder.f.id }
          output "url" { value = omni_folder.f.url }
          EOF
          terraform init -input=false >/dev/null
          echo "LIVE=${RUNNER_TEMP}/live" >> "$GITHUB_ENV"
          echo "FOLDER=tf-edge-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: TC-09b drift is detected after an out-of-band change
        run: |
          cd "$LIVE"
          terraform apply -auto-approve -var "folder_name=${FOLDER}" >/dev/null
          ID=$(terraform output -raw id)
          echo "FOLDER_ID=${ID}" >> "$GITHUB_ENV"

          # Rename it behind Terraform's back, exactly as a UI edit would.
          curl -sf -X PATCH -H "Authorization: Bearer $OMNI_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${FOLDER}-changed-in-ui\"}" \
            "$OMNI_BASE_URL/api/v1/folders/${ID}" >/dev/null

          set +e
          terraform plan -detailed-exitcode -var "folder_name=${FOLDER}" -out=/dev/null
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "PASS: drift detected and a correction proposed"
          else
            echo "FAIL: expected exit code 2, got $code"; exit 1
          fi

          terraform apply -auto-approve -var "folder_name=${FOLDER}" >/dev/null
          echo "corrected back to ${FOLDER}"

      - name: TC-20 import a folder and confirm a clean plan
        run: |
          cd "$LIVE"
          terraform state rm omni_folder.f >/dev/null
          terraform import -var "folder_name=${FOLDER}" omni_folder.f "$FOLDER_ID" >/dev/null
          set +e
          terraform plan -detailed-exitcode -var "folder_name=${FOLDER}" -out=/dev/null
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "PASS: imported state matches configuration"
          else
            echo "FAIL: plan after import was not clean (exit $code)"; exit 1
          fi

      - name: TC-33 a resource deleted outside Terraform is removed from state
        run: |
          cd "$LIVE"
          curl -sf -X DELETE -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/folders/${FOLDER_ID}?force=true" >/dev/null

          set +e
          terraform plan -detailed-exitcode -var "folder_name=${FOLDER}" -out=/dev/null
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "PASS: dropped from state and a recreate proposed"
          else
            echo "FAIL: expected exit code 2, got $code"; exit 1
          fi

      - name: TC-22 a non-empty folder will not delete without the recursive flag
        run: |
          mkdir -p "${RUNNER_TEMP}/tc22" && cd "${RUNNER_TEMP}/tc22"
          cat > main.tf <<'EOF'
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "n" { type = string }
          resource "omni_folder" "parent" {
            name               = var.n
            path               = var.n
            delete_recursively = false
          }
          output "id" { value = omni_folder.parent.id }
          EOF
          terraform init -input=false >/dev/null
          terraform apply -auto-approve -var "n=tf-edge-parent-r${GITHUB_RUN_NUMBER}" >/dev/null
          PARENT=$(terraform output -raw id)

          # A child Terraform does not know about, so destroy sees an empty folder
          # in state and a non-empty one on the instance.
          curl -sf -X POST -H "Authorization: Bearer $OMNI_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"orphan-child\",\"parentFolderId\":\"${PARENT}\"}" \
            "$OMNI_BASE_URL/api/v1/folders" >/dev/null

          set +e
          terraform destroy -auto-approve -var "n=tf-edge-parent-r${GITHUB_RUN_NUMBER}" 2>err.txt
          code=$?
          set -e
          cat err.txt
          if [ $code -eq 0 ]; then
            echo "FAIL: destroy of a non-empty folder succeeded without the recursive flag."
            echo "Edge run 1 showed the API returns 400 here, so this is a change in behaviour."
            CLEANUP_FAILED=1
          else
            if grep -qi "only empty folders" err.txt; then
              echo "PASS: destroy refused with the documented message"
            else
              echo "FAIL: destroy failed, but not for the documented reason"
              CLEANUP_FAILED=1
            fi
          fi

          # Clean up before reporting, so a failure never leaves the folder behind.
          curl -s -X DELETE -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/folders/${PARENT}?force=true" >/dev/null || true
          [ -z "${CLEANUP_FAILED:-}" ] || exit 1

      - name: TC-03b/TC-13b user attributes, using one discovered on the instance
        run: |
          set -o pipefail
          # Retry rather than crash: a rate-limited or transient response leaves
          # curl with empty output, which is not the same as "no attributes".
          BODY=""
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /tmp/attrs.json -w '%{http_code}' \
              -H "Authorization: Bearer $OMNI_API_TOKEN" \
              "$OMNI_BASE_URL/api/v1/user-attributes")
            if [ "$CODE" = "200" ]; then
              BODY=$(cat /tmp/attrs.json)
              break
            fi
            echo "attempt ${attempt}: user-attributes returned ${CODE}, retrying"
            sleep 10
          done

          if [ -z "$BODY" ]; then
            echo "FAIL: could not read /v1/user-attributes after 3 attempts (last status ${CODE})"
            exit 1
          fi

          REF=$(printf '%s' "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          items = d if isinstance(d, list) else (d.get('records') or d.get('userAttributes') or d.get('results') or [])
          refs = [i.get('reference') or i.get('name') for i in items if isinstance(i, dict)]
          # Skip Omni's built-in attributes: they are populated by the platform
          # and not returned as user attributes, so setting one drifts forever.
          refs = [r for r in refs if r and not r.startswith('omni_')]
          print(refs[0] if refs else '')
          ")

          if [ -z "$REF" ]; then
            echo "SKIP: this instance has no user-defined attribute, only Omni built-ins."
            echo "TC-03b and TC-13b remain UNTESTED. Create one attribute under"
            echo "Settings > User attributes and re-run to close them."
            echo "::warning::TC-03b/TC-13b skipped: no user-defined attribute on the instance"
            exit 0
          fi
          echo "using attribute reference: $REF"

          mkdir -p "${RUNNER_TEMP}/attrs" && cd "${RUNNER_TEMP}/attrs"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "v" { type = string }
          resource "omni_user" "u" {
            user_name    = "tf-edge-attr-r${GITHUB_RUN_NUMBER}@example.invalid"
            display_name = "TF Edge Attr"
            attributes   = { "${REF}" = var.v }
          }
          EOF
          terraform init -input=false >/dev/null

          terraform apply -auto-approve -var 'v=first' >/dev/null
          echo "PASS TC-03b: user created with an attribute"

          set +e
          terraform plan -detailed-exitcode -var 'v=first' -out=/dev/null
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "PASS: attribute round-trips with no drift"
          else
            echo "FAIL: drift on the attribute (exit $code)"; exit 1
          fi

          terraform apply -auto-approve -var 'v=second' >/dev/null
          echo "PASS TC-13b: attribute value changed in place"

          terraform destroy -auto-approve -var 'v=second' >/dev/null

      # The permits response shape is undocumented beyond "each entry has a
      # role", so this prints the real payload. Until it is confirmed, the
      # provider resolves the subject from whichever key it finds.
      - name: TC-P01..P05 folder permissions
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/perms" && cd "${RUNNER_TEMP}/perms"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "role" { type = string }

          resource "omni_folder" "f" {
            name = "tf-edge-perm-r${GITHUB_RUN_NUMBER}"
            path = "tf-edge-perm-r${GITHUB_RUN_NUMBER}"
          }
          resource "omni_user_group" "g" {
            display_name = "tf-edge-perm-group-r${GITHUB_RUN_NUMBER}"
          }
          resource "omni_folder_permission" "p" {
            folder_id      = omni_folder.f.id
            role           = var.role
            user_group_ids = [omni_user_group.g.id]
          }
          output "folder_id" { value = omni_folder.f.id }
          output "group_id"  { value = omni_user_group.g.id }
          EOF
          terraform init -input=false >/dev/null

          terraform apply -auto-approve -var 'role=VIEWER' >/dev/null
          FOLDER=$(terraform output -raw folder_id)
          echo "PASS TC-P01: permission granted to group $(terraform output -raw group_id)"

          echo "--- permits as the API reports them ---"
          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/folders/${FOLDER}/permissions" | python3 -m json.tool

          set +e
          terraform plan -detailed-exitcode -out=/dev/null -var 'role=VIEWER'
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "PASS TC-P02: permission reads back with no drift"
          else
            echo "FAIL TC-P02: drift after grant (exit $code). Compare the permits payload above"
            echo "with Permit.SubjectID in internal/client/permissions.go."
            exit 1
          fi

          # Changing the role replaces the resource, since role is part of its identity.
          terraform apply -auto-approve -var 'role=EDITOR' >/dev/null
          echo "PASS TC-P03: role change applied"

          curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/v1/folders/${FOLDER}/permissions" \
          | python3 -c "
          import sys, json, os
          permits = json.load(sys.stdin).get('permits', [])
          roles = [p.get('role') for p in permits]
          print('  roles now:', roles)
          if 'EDITOR' not in roles:
              sys.exit('FAIL TC-P04: EDITOR not present after the role change')
          print('PASS TC-P04: role change confirmed server side')
          "

          terraform destroy -auto-approve -var 'role=EDITOR' >/dev/null
          echo "PASS TC-P05: permission revoked and folder destroyed"

      - name: TC-14b removing the only group member leaves the group in place
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/tc14b" && cd "${RUNNER_TEMP}/tc14b"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "keep_member" { type = bool }
          resource "omni_user" "u" {
            user_name    = "tf-edge-member-r${GITHUB_RUN_NUMBER}@example.invalid"
            display_name = "TF Edge Member"
          }
          resource "omni_user_group" "g" {
            display_name = "tf-edge-group-r${GITHUB_RUN_NUMBER}"
            member_ids   = var.keep_member ? [omni_user.u.id] : []
          }
          output "group_id" { value = omni_user_group.g.id }
          EOF
          terraform init -input=false >/dev/null

          terraform apply -auto-approve -var 'keep_member=true' >/dev/null
          GID=$(terraform output -raw group_id)

          terraform apply -auto-approve -var 'keep_member=false' >/dev/null
          COUNT=$(curl -sf -H "Authorization: Bearer $OMNI_API_TOKEN" \
            "$OMNI_BASE_URL/api/scim/v2/groups/${GID}" \
          | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('members') or []))")

          if [ "$COUNT" = "0" ]; then
            echo "PASS: membership emptied, group survives"
          else
            echo "FAIL: group still reports $COUNT members"; exit 1
          fi

          terraform destroy -auto-approve -var 'keep_member=false' >/dev/null

      - name: TC-08b/TC-18b/TC-18c/TC-28b connection lifecycle
        if: inputs.test_connection
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/conn" && cd "${RUNNER_TEMP}/conn"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "base_role" { type = string }
          variable "host"      { type = string }
          resource "omni_connection" "c" {
            name      = "tf-edge-conn-r${GITHUB_RUN_NUMBER}"
            dialect   = "postgres"
            host      = var.host
            port      = 5432
            database  = "postgres"
            username  = "tf_edge_test"
            password  = "not-a-real-password"
            base_role = var.base_role
          }
          output "id" { value = omni_connection.c.id }
          EOF
          terraform init -input=false >/dev/null

          set +e
          terraform apply -auto-approve -var 'base_role=NO_ACCESS' -var 'host=db.invalid.example' 2>err.txt
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            cat err.txt
            echo "FAIL TC-08b: create failed. Edge run 1 established that the API does not"
            echo "validate connectivity on create, so this is a regression, not an expectation."
            exit 1
          fi
          echo "PASS TC-08b: connection created"

          set +e
          terraform plan -detailed-exitcode -var 'base_role=NO_ACCESS' -var 'host=db.invalid.example' -out=/dev/null
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "PASS: connection reads back with no drift"
          else
            echo "FAIL: drift after create (exit $rc)"; exit 1
          fi

          terraform apply -auto-approve -var 'base_role=QUERIER' -var 'host=db.invalid.example' >/dev/null
          echo "PASS TC-18b: base_role changed in place"

          terraform plan -no-color -var 'base_role=QUERIER' -var 'host=other.invalid.example' > replace.txt
          if grep -q "must be replaced\|forces replacement" replace.txt; then
            echo "PASS TC-18c: changing host forces replacement"
          else
            echo "FAIL TC-18c: host change did not force replacement"; exit 1
          fi

          terraform destroy -auto-approve -var 'base_role=QUERIER' -var 'host=db.invalid.example' >/dev/null
          echo "PASS TC-28b: connection destroyed"

      - name: TC-S01..S04 connection schema refresh schedule
        if: inputs.test_connection
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/sched" && cd "${RUNNER_TEMP}/sched"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "cron" { type = string }

          resource "omni_connection" "c" {
            name      = "tf-edge-sched-conn-r${GITHUB_RUN_NUMBER}"
            dialect   = "postgres"
            host      = "db.invalid.example"
            port      = 5432
            database  = "postgres"
            username  = "tf_edge_test"
            password  = "not-a-real-password"
            base_role = "NO_ACCESS"
          }
          resource "omni_connection_schedule" "s" {
            connection_id = omni_connection.c.id
            schedule      = var.cron
            timezone      = "Australia/Melbourne"
          }
          output "description" { value = omni_connection_schedule.s.description }
          EOF
          terraform init -input=false >/dev/null

          # Six-field EventBridge cron, not five-field Unix cron.
          terraform apply -auto-approve -var 'cron=0 2 * * ? *' >/dev/null
          echo "PASS TC-S01: schedule created, description: $(terraform output -raw description)"

          set +e
          terraform plan -detailed-exitcode -out=/dev/null -var 'cron=0 2 * * ? *'
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "PASS TC-S02: schedule reads back with no drift"
          else
            echo "FAIL TC-S02: drift after create (exit $code)"; exit 1
          fi

          terraform apply -auto-approve -var 'cron=30 4 * * ? *' >/dev/null
          echo "PASS TC-S03: cron changed in place, description now: $(terraform output -raw description)"

          terraform destroy -auto-approve -var 'cron=30 4 * * ? *' >/dev/null
          echo "PASS TC-S04: schedule and connection destroyed"

      - name: TC-E01..E03 connection environment
        if: inputs.test_connection
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/env" && cd "${RUNNER_TEMP}/env"
          cat > main.tf <<EOF
          terraform {
            required_providers { omni = { source = "ashima-omni/omni" } }
          }
          provider "omni" {}
          variable "tenant" { type = string }

          resource "omni_connection" "base" {
            name      = "tf-edge-base-r${GITHUB_RUN_NUMBER}"
            dialect   = "postgres"
            host      = "db.invalid.example"
            port      = 5432
            database  = "postgres"
            username  = "tf_edge_test"
            password  = "not-a-real-password"
            base_role = "NO_ACCESS"
          }
          resource "omni_connection" "tenant" {
            name      = "tf-edge-tenant-r${GITHUB_RUN_NUMBER}"
            dialect   = "postgres"
            host      = "db.invalid.example"
            port      = 5432
            database  = "postgres"
            username  = "tf_edge_test"
            password  = "not-a-real-password"
            base_role = "NO_ACCESS"
          }
          resource "omni_connection_environment" "e" {
            base_connection_id        = omni_connection.base.id
            environment_connection_id = omni_connection.tenant.id
            user_attribute_values     = [var.tenant]
          }
          output "env_id" { value = omni_connection_environment.e.id }
          EOF
          terraform init -input=false >/dev/null

          terraform apply -auto-approve -var 'tenant=acme' >/dev/null
          echo "PASS TC-E01: connection environment created, id $(terraform output -raw env_id)"

          terraform apply -auto-approve -var 'tenant=globex' >/dev/null
          echo "PASS TC-E02: attribute values updated in place"

          # No read endpoint exists, so a plan can only ever be clean here.
          # This asserts the documented behaviour rather than real drift detection.
          set +e
          terraform plan -detailed-exitcode -out=/dev/null -var 'tenant=globex'
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "NOTE TC-E03: plan is clean, but only because the API has no read endpoint."
            echo "This resource cannot detect drift. Documented, not a guarantee."
          else
            echo "FAIL TC-E03: unexpected plan result (exit $code)"; exit 1
          fi

          terraform destroy -auto-approve -var 'tenant=globex' >/dev/null
          echo "PASS TC-E04: connection environment and both connections destroyed"

      - name: Clean up anything left behind
        if: always()
        run: |
          if [ -n "${LIVE:-}" ] && cd "$LIVE" 2>/dev/null; then
            terraform destroy -auto-approve -var "folder_name=${FOLDER}" >/dev/null 2>&1 || true
          fi
          bash test/cleanup-orphans.sh --delete 2>/dev/null || true
          echo "cleanup attempted"
